<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目动画</title><link rel="stylesheet" href="../../assets/reference/fonts.css"><link rel="stylesheet" href="films.css"><style>.library{max-width:1180px;margin:0 auto;padding:40px 28px 80px}.back{font-size:13px;color:#68816e}.library h1{font-size:34px;font-weight:600;letter-spacing:-1px;margin:35px 0 45px}.library h2{font-size:19px;font-weight:500;margin:42px 0 20px}.film-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}.film-card img{width:100%;aspect-ratio:1200/760;object-fit:cover;border-radius:13px;border:1px solid #d3dfd0;transition:transform .25s}.film-card:hover img{transform:translateY(-4px)}.film-card span{display:block;font-size:16px;margin-top:13px}.film-card{min-width:0}@media(max-width:700px){.library{padding:24px 18px 50px}.library h1{font-size:28px;margin-bottom:30px}.film-grid{grid-template-columns:1fr;gap:24px}.film-card span{font-size:16px}}@media(prefers-reduced-motion:reduce){.film-card img{transition:none}}</style><script type="module">import{films}from'./catalog.mjs';for(const project of ['Research Agent','GamePlayer']){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=project;section.append(h);const grid=document.createElement('div');grid.className='film-grid';for(const f of films.filter(f=>f.project===project)){const a=document.createElement('a');a.className='film-card';a.href=f.url||`player.html?film=${f.id}&autoplay=1`;a.innerHTML=`<img src="thumbnails/${f.id}.png" alt="${f.name}动画画面"><span>${f.name}</span>`;grid.append(a)}section.append(grid);document.querySelector('.library').append(section)}</script></head><body><main class="library"><a class="back" href="../../index.html#work">← 返回主页</a><h1>项目动画</h1></main></body></html>
